<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VoiceBox | Anonymous Feedback Portal</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Classic Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js"></script>
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <div class="header-container">
      <h1>🎤 VoiceBox</h1>
      <p>Anonymous Student Feedback Portal</p>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="tabs">
        <button class="tab-btn active" data-tab="submit">Send Feedback</button>
        <button class="tab-btn" data-tab="admin">Admin Dashboard</button>
      </div>

      <section id="submit" class="tab-content active">
        <div class="card">
          <h2>Submit Feedback</h2>
          <form id="feedbackForm">
            <label>Category</label>
            <select id="category">
              <option>Teacher</option>
              <option>Facilities</option>
              <option>Academics</option>
              <option>Bullying</option>
              <option>Suggestion</option>
              <option>Other</option>
            </select>

            <label>Message</label>
            <textarea id="message" rows="4" placeholder="Write your feedback here..." required></textarea>

            <label>Alias (optional)</label>
            <input id="alias" type="text" placeholder="Leave blank to stay anonymous" />

            <button type="submit">Send Feedback</button>
            <p id="status"></p>
          </form>
        </div>
      </section>

      <section id="admin" class="tab-content">
        <div class="card">
          <h2>📊 Admin Dashboard</h2>
          <button id="loadFeedback">Load Feedback</button>
          <ul id="feedbackList" class="feedback-list"></ul>
        </div>
      </section>
    </div>
  </main>

  <footer>
    <p>© 2025 VoiceBox | Built for School Improvement</p>
  </footer>
</body>
</html>
